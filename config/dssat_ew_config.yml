paths:
  weather_daily: "data/weather_daily.csv"
  phenology_windows: "data/phenology_windows.csv"
  dssat_outputs: "data/dssat_outputs.csv"
  observations: "data/gcor_observations.csv"
  climate_background: "data/climate_background.csv"
  harvested_area: "data/harvested_area.csv"
  model_dir: "models"
  result_dir: "results"

columns:
  id: ["grid_id", "year", "crop"]
  scenario: ["esm", "ssp", "treatment"]
  target_variables: ["yield", "n2o", "ch4"]
  crop_specific_ch4: ["rice"]

extremes:
  baseline_years: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014]
  heat_prob: 0.90
  cold_prob: 0.10
  precip_prob: 0.95
  treatments: ["baseline", "no_heat", "no_cold", "no_precip", "no_all"]

residual_model:
  engine: "randomForest"
  ntree: 500
  nodesize: 5
  mtry: null
  seed: 123
  validation: "leave_one_out"
  lambda_quantile: 0.95

predictors:
  dssat_state:
    - yield_dssat
    - n2o_dssat
    - ch4_dssat
    - lai_dssat
    - soil_moisture_dssat
    - soil_n_dssat
  exposure:
    - heat_exposure
    - cold_exposure
    - precip_exposure
    - heat_frequency
    - cold_frequency
    - precip_frequency
    - heat_exposure_early
    - heat_exposure_late
    - cold_exposure_early
    - cold_exposure_late
    - precip_exposure_early
    - precip_exposure_late
  background_climate:
    - mean_tmax
    - mean_tmin
    - total_precip
    - mean_srad

gwp100:
  ch4: 27
  n2o: 273

attribution:
  group_cols: ["crop", "ssp", "esm", "year"]
  area_weight_col: "harvested_area"
